<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Collection</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="collection-page">

<div class="app">

    <button id="backToJarButton">

    <span class="button-icon">

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path
                d="M19 12H5"
            />
            <path
                d="M12 19l-7-7 7-7"
            />
        </svg>

    </span>

    Back

</button>

    <header>

        <h1>
            <img
                src="./icons/sticky-notes-collected.png"
                class="title-emoji"
                alt=""
            >
            My Collection
        </h1>

        <div id="collectionSearch">

        <input
                type="search"
                id="collectionSearchInput"
                placeholder="Search your Post-its..."
                autocomplete="off"
            >

        </div>

        <div id="categoryButtons"></div>

    </header>


    <section id="collectionSection">

        <div id="collectionGrid"></div>

    </section>


    <!-- NOTE MODAL -->

    <div id="noteModal" class="modal">

        <div
            id="bigNote"
            class="big-note"
        >

            <div id="noteCategory"></div>

            <div id="noteText"></div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="collection.js"></script>

<script>
    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            () => {

                navigator.serviceWorker
                    .register("./sw.js")
                    .then(
                        registration => {

                            console.log(
                                "Service Worker registered:",
                                registration.scope
                            );

                        }
                    )
                    .catch(
                        error => {

                            console.error(
                                "Service Worker registration failed:",
                                error
                            );

                        }
                    );

            }
        );

    }
</script>

<footer class="copyright">
    © 26-08-2016 Jar, made by Lili and digitized by Jia. All rights reserved.
</footer>

</body>

</html>
