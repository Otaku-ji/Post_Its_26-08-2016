<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Set Up PIN</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="pin-container">

        <div class="pin-card">

            <h1>Set Up PIN</h1>

            <p
                id="setupPinSubtitle"
                class="pin-subtitle"
            >
                Create a 5-digit PIN to protect your game.
            </p>


            <div
                id="setupPinDots"
                class="pin-dots"
            >

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <div
                id="setupPinStatus"
                class="pin-message"
            ></div>


            <div class="pin-keypad">

                <button
                    type="button"
                    data-digit="1"
                >1</button>

                <button
                    type="button"
                    data-digit="2"
                >2</button>

                <button
                    type="button"
                    data-digit="3"
                >3</button>


                <button
                    type="button"
                    data-digit="4"
                >4</button>

                <button
                    type="button"
                    data-digit="5"
                >5</button>

                <button
                    type="button"
                    data-digit="6"
                >6</button>


                <button
                    type="button"
                    data-digit="7"
                >7</button>

                <button
                    type="button"
                    data-digit="8"
                >8</button>

                <button
                    type="button"
                    data-digit="9"
                >9</button>


                <button
                    type="button"
                    class="empty-button"
                    disabled
                ></button>


                <button
                    type="button"
                    data-digit="0"
                >0</button>


                <button
                    type="button"
                    id="setupDeleteButton"
                >
                    ←
                </button>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="setup-pin.js"></script>


    <footer class="copyright">
        © 2026 made by Jia. All rights reserved.
    </footer>

</body>

</html>
