<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Special Jar - My Collection</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>

<div class="app collection-page">

    <!-- HEADER -->

    <header>

        <h1>
            My Collection
        </h1>

        <div class="stats">

            <div>

                <img
                    src="./icons/post-it-remaining.png"
                    class="stat-emoji"
                    alt=""
                >

                <span id="jar2CollectedCount">
                    0
                </span>

                notes collected

            </div>

        </div>

    </header>


    <!-- BACK TO JAR -->

    <section class="collection-top">

        <button
            id="jar2BackButton"
            type="button"
        >

            ← Back to Special Jar

        </button>

    </section>


    <!-- SEARCH -->

    <section class="collection-search">

        <input
            type="search"
            id="jar2SearchInput"
            placeholder="Search your collection..."
            autocomplete="off"
        >

    </section>


    <!-- CATEGORY FILTERS -->

    <section
        id="jar2CategoryFilters"
        class="category-filters"
    >

        <!-- Categories are generated by JavaScript -->

    </section>


    <!-- COLLECTION -->

    <main
        id="jar2CollectionGrid"
        class="collection-grid"
    >

        <!-- Notes are generated by JavaScript -->

    </main>


    <!-- EMPTY MESSAGE -->

    <p
        id="jar2EmptyMessage"
        class="collection-empty"
    >
        No Post-its found.
    </p>

</div>


<!-- NOTE MODAL -->

<div
    id="jar2CollectionModal"
    class="modal"
>

    <div
        id="jar2CollectionBigNote"
        class="big-note"
    >

        <div
            id="jar2CollectionNoteCategory"
        ></div>

        <div
            id="jar2CollectionNoteText"
        ></div>

        <div
            id="jar2CollectionNoteDate"
        ></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="jar2collection.js"></script>


<script>

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            () => {

                navigator.serviceWorker
                    .register("./sw.js")
                    .then(
                        registration => {

                            console.log(
                                "Service Worker registered:",
                                registration.scope
                            );

                        }
                    )
                    .catch(
                        error => {

                            console.error(
                                "Service Worker registration failed:",
                                error
                            );

                        }
                    );

            }
        );

    }

</script>


<footer class="copyright">

    © 2026 Jar, made by Jia. All rights reserved.

</footer>


</body>

</html>
