<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Enter PIN</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="pin-container">

        <div class="pin-card">

            <h1>Enter PIN</h1>

            <p class="pin-subtitle">
                Enter your 5-digit PIN to continue.
            </p>


            <div
                id="pinDots"
                class="pin-dots"
            >

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <div
                id="pinMessage"
                class="pin-message"
            ></div>


            <div class="pin-keypad">

                <button type="button" data-digit="1">1</button>
                <button type="button" data-digit="2">2</button>
                <button type="button" data-digit="3">3</button>

                <button type="button" data-digit="4">4</button>
                <button type="button" data-digit="5">5</button>
                <button type="button" data-digit="6">6</button>

                <button type="button" data-digit="7">7</button>
                <button type="button" data-digit="8">8</button>
                <button type="button" data-digit="9">9</button>

                <button
                    type="button"
                    class="empty-button"
                    disabled
                ></button>

                <button type="button" data-digit="0">0</button>

                <button
                    type="button"
                    id="deleteButton"
                >
                    ←
                </button>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="pin.js"></script>

<footer class="copyright">
    © 26-08-2016 Jar, made by Lili and digitized by Jia. All rights reserved.
</footer>

</body>

</html>
